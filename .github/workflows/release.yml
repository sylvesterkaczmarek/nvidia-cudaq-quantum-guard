name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nvidia-cudaq-quantum-guard
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    name: Verify PyPI install (Python ${{ matrix.python-version }})
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Read package version
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
      - name: Install exact public PyPI package
        run: |
          python -m venv /tmp/cudaq-guard-pypi
          /tmp/cudaq-guard-pypi/bin/python -m pip install --upgrade pip
          installed=false
          for attempt in {1..12}; do
            if /tmp/cudaq-guard-pypi/bin/python -m pip install --no-cache-dir --index-url https://pypi.org/simple "nvidia-cudaq-quantum-guard==$PACKAGE_VERSION"; then
              installed=true
              break
            fi
            echo "PyPI package not available yet; retrying in 10 seconds..."
            sleep 10
          done
          test "$installed" = true
          /tmp/cudaq-guard-pypi/bin/python -m pip check
      - name: Verify installed public package
        run: |
          cd /tmp
          /tmp/cudaq-guard-pypi/bin/python - <<'PY'
          import json
          import os
          import subprocess
          from importlib.metadata import version
          from pathlib import Path

          import cudaq_guard

          expected = os.environ["PACKAGE_VERSION"]
          assert version("nvidia-cudaq-quantum-guard") == expected
          assert Path(cudaq_guard.__file__).is_relative_to(Path("/tmp/cudaq-guard-pypi"))
          executable = "/tmp/cudaq-guard-pypi/bin/cudaq-guard"
          actual = subprocess.check_output([executable, "--version"], text=True).strip()
          assert actual == f"cudaq-guard {expected}"
          subprocess.run([executable, "--help"], check=True, stdout=subprocess.DEVNULL)
          doctor = subprocess.run([executable, "doctor", "--json"], capture_output=True, text=True)
          assert doctor.returncode == 2
          report = json.loads(doctor.stdout)
          assert report["cudaq_installed"] is False
          PY
